services:
  - type: web
    name: fitmate-server
    env: node
    rootDir: server
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: LOCAL_DEV
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: CORS_ORIGIN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: fitmate-db
          property: connectionString
    region: singapore
    plan: free
    healthCheckPath: /api/health
databases:
  - name: fitmate-db
    databaseName: fitmate
    plan: free
    region: singapore
