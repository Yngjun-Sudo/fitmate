{
  "name": "fitmate-server",
  "version": "1.0.0",
  "builds": [
    {
      "src": "dist/index.js",
      "use": "@render/node@latest"
    }
  ],
  "services": [
    {
      "name": "fitmate-server",
      "env": {
        "NODE_ENV": "production",
        "PORT": "3001",
        "DATABASE_URL": "postgresql://placeholder:placeholder@localhost:5432/fitmate",
        "JWT_SECRET": "fitmate-jwt-secret-prod",
        "DEEPSEEK_API_KEY": "sk-placeholder",
        "DEEPSEEK_BASE_URL": "https://api.deepseek.com",
        "CORS_ORIGIN": "https://fitmate.pages.dev"
      },
      "healthCheckPath": "/api/health",
      "region": "singapore",
      "plan": "free",
      "addons": []
    }
  ]
}
